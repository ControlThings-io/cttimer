app-id: io.controlthings.cttimer
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: cttimer

finish-args:
  # Normalized resource timestamps can leave Qt using QML cached by an older build.
  - --env=QML_DISABLE_DISK_CACHE=1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: cttimer
    buildsystem: cmake-ninja
    config-opts:
      - -DCTTIMER_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
